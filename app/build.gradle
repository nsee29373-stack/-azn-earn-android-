
apply plugin: 'com.android.application'

android {
    namespace "com.hamrahtradermarket.app"
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.hamrahtradermarket.app"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }

        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
